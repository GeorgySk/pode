# Keep the jobs and commands in sync with .gitlab-ci.yml (if present).
#
# To save Actions minutes, what runs depends on the event:
# - pull requests: every check, with the tests on the oldest and newest
#   Python; nothing while the pull request is a draft (marking it ready for
#   review starts the checks), and a new push cancels the previous run.
# - pushes to main: only the tests on the oldest Python, which upload
#   coverage, so Codecov and the README badge have a result for main.
# - final release tags (vX.Y.Z, not vX.Y.Z-alpha): every check with the tests
#   on every Python, then the publish and release jobs.
name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  POETRY_VERSION: "2.5.1"

jobs:
  # The other checks wait for this one (and, like it, skip pushes to main and
  # draft pull requests), so a lint failure doesn't start them.
  lint:
    if: >-
      github.ref_type == 'tag'
      || github.event_name == 'pull_request'
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"
      - name: Install dependencies
        run: poetry install --with dev
      - name: Check code
        run: poetry run ruff check .
      - name: Type check
        run: poetry run mypy .

  # Runs on pushes to main too, where lint is skipped.
  test:
    needs: lint
    if: >-
      !cancelled() && needs.lint.result != 'failure'
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every Python on release tags, the oldest and newest on pull
        # requests, the oldest on main.
        python-version: >-
          ${{ fromJSON(github.ref_type == 'tag' && '["3.11", "3.12", "3.13", "3.14"]'
          || github.event_name == 'pull_request' && '["3.11", "3.14"]'
          || '["3.11"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"
      - name: Install dependencies
        run: poetry install --with dev
      - name: Run tests
        run: poetry run pytest --cov --cov-report=term --cov-report=xml --junitxml=report.xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"
      - name: Build sdist and wheel
        run: poetry build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docs:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"
      - name: Install dependencies
        run: poetry install --with docs
      - name: Build docs (warnings are errors)
        run: poetry run sphinx-build -W --keep-going -b html docs/source docs/build/html

  # The one check to require before merging a pull request (branch protection
  # or a ruleset): it fails unless every check above passed, and its name
  # doesn't change with the test matrix.
  ci-passed:
    needs: [lint, test, build, docs]
    if: >-
      !cancelled() && github.event_name == 'pull_request'
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every check passed
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        run: exit 1

  # Final releases only: tags like v1.2.3, not v1.2.3-alpha.
  publish-pypi:
    needs: [lint, test, build, docs]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the project version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          if [ "${GITHUB_REF_NAME#v}" != "${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version}"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-docker:
    needs: [lint, test, build, docs]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Read build args from .env
        run: grep -E '^(PYTHON_IMAGE_VERSION|POETRY_VERSION)=' .env >> "$GITHUB_ENV"
      - name: Set image name and version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            PYTHON_IMAGE_VERSION=${{ env.PYTHON_IMAGE_VERSION }}
            POETRY_VERSION=${{ env.POETRY_VERSION }}
            IMAGE_TYPE=prod
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest

  # A GitHub release for each final version, with the version's CHANGES.rst
  # section as release notes. Independent of the publish jobs: the tag is the
  # release, and a failed upload is re-run rather than abandoned.
  release:
    needs: [lint, test, build, docs]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/checkout@v7
      - name: Write release notes from CHANGES.rst
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          if [ "${version}" != "${project_version}" ]; then
            echo "Tag v${version} does not match version ${project_version}" >&2
            exit 1
          fi
          awk -v version="${version}" '
            { line[NR] = $0 }
            END {
              for (i = 1; i < NR; i++) {
                if (index(line[i], version " (") == 1 && line[i + 1] ~ /^-+$/) {
                  start = i + 2
                  break
                }
              }
              if (!start) {
                print "No section for " version " in CHANGES.rst" > "/dev/stderr"
                exit 1
              }
              for (i = start; i <= NR; i++) {
                if (line[i + 1] ~ /^-+$/) break
                if (line[i + 1] ~ /^~+$/) {
                  print "### " line[i]
                  i++
                } else print line[i]
              }
            }' CHANGES.rst > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No notable changes." > release-notes.md
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" --verify-tag
          --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
