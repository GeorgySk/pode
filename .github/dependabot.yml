version: 2
updates:
  # Poetry: pyproject.toml (+ poetry.lock, if committed). Only the project's
  # own dependencies ([project] dependencies): the dev and docs groups come
  # from the template, which updates them in one place, and reach this
  # project through `copier update`.
  - package-ecosystem: "pip"
    directory: "/"
    allow:
      - dependency-type: "production"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  # .devcontainer/devcontainer.json
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
  # .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
